<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#58a6ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);width:360px;font-family:-apple-system,sans-serif;font-size:13px;}
.header{background:var(--surface);padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.header h1{font-size:14px;font-weight:600;}
.content{padding:12px;}
.word-display{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:40px 20px;text-align:center;margin-bottom:12px;min-height:120px;display:flex;align-items:center;justify-content:center;}
.word{font-size:32px;font-weight:600;color:#f0f6fc;letter-spacing:1px;}
.focus-letter{color:var(--accent);}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.btn{padding:6px 14px;border-radius:6px;border:none;font-size:12px;cursor:pointer;font-weight:500;background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn.primary{background:#238636;color:#fff;border-color:#238636;}
.btn.primary:hover{background:#2ea043;}
.btn:hover{background:#30363d;}
input[type=range]{flex:1;min-width:80px;}
.wpm{font-size:12px;color:var(--text);min-width:70px;}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:12px;resize:vertical;min-height:60px;margin-bottom:8px;font-family:inherit;}
</style></head><body>
<div class="header"><span style="font-size:18px;">⚡</span><h1>SpeedRead</h1></div>
<div class="content">
  <textarea id="text-input" placeholder="Paste text to speed read...">SpeedRead helps you read faster by flashing words one at a time. Your brain processes words faster than your eyes can move. Eliminate subvocalization and eye movement to dramatically increase your reading speed.</textarea>
  <div class="word-display"><div class="word" id="word-display">Ready</div></div>
  <div class="controls">
    <button class="btn primary" id="play-btn">▶ Play</button>
    <button class="btn" id="pause-btn">⏸</button>
    <button class="btn" id="reset-btn">↺</button>
    <input type="range" id="speed" min="100" max="1000" value="300" step="10">
    <span class="wpm" id="wpm-label">300 WPM</span>
  </div>
</div>
<script src="popup.js"></script>
</body></html>
